<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume — placeholder</title>
    <!-- ============================================================= -->
    <!--  TO MAKE A NEW TAILORED VERSION:                              -->
    <!--   1. Copy this whole folder: r/_template  ->  r/<role>        -->
    <!--      (e.g. r/sales, r/engineering, r/product)                 -->
    <!--   2. Replace THIS file (index.html) with your tailored        -->
    <!--      resume export. The link lands straight on it.            -->
    <!--   3. Send the link:  .../hire-me-video/r/<role>/              -->
    <!-- ============================================================= -->
    <style>
        body { background:#faf9f5; color:#2b2118; font-family:-apple-system,BlinkMacSystemFont,sans-serif;
               display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .box { max-width:560px; padding:2rem; line-height:1.6; }
        code { background:#efe9df; padding:2px 6px; border-radius:4px; }
        h1 { font-size:1.3rem; margin-bottom:1rem; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Replace this file with your tailored resume</h1>
        <p>This folder is a template. To finish a new version:</p>
        <ol>
            <li>Export/generate your tailored resume as a single HTML file.</li>
            <li>Save it here as <code>index.html</code> (overwrite this file).</li>
        </ol>
        <p>The recipient's link <code>.../r/&lt;role&gt;/</code> opens this file directly.</p>
    </div>
</body>
</html>
